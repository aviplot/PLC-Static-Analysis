[versions]
java = "21"
antlr = "4.13.2"
junit = "6.1.3"
assertj = "3.27.7"
picocli = "4.7.7"
spotless = "8.10.3"
palantir-java-format = "2.100.0"
checkstyle = "14.3.0"
woodstox = "7.3.0"
jazzer = "0.30.0"
jmh = "1.37"
jackson = "3.2.3"
json-schema-validator = "3.0.8"

[libraries]
antlr-tool = { module = "org.antlr:antlr4", version.ref = "antlr" }
antlr-runtime = { module = "org.antlr:antlr4-runtime", version.ref = "antlr" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
woodstox = { module = "com.fasterxml.woodstox:woodstox-core", version.ref = "woodstox" }
jazzer-junit = { module = "com.code-intelligence:jazzer-junit", version.ref = "jazzer" }
jmh-core = { module = "org.openjdk.jmh:jmh-core", version.ref = "jmh" }
jmh-annprocess = { module = "org.openjdk.jmh:jmh-generator-annprocess", version.ref = "jmh" }
jackson-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-yaml = { module = "tools.jackson.dataformat:jackson-dataformat-yaml", version.ref = "jackson" }
json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "json-schema-validator" }
picocli = { module = "info.picocli:picocli", version.ref = "picocli" }
spotless-gradle = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
